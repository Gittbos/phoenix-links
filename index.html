<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="PHOENIX — fitness, discipline, progress. Усі мої соцмережі в одному місці.">
  <title>PHOENIX — links</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090909;
      --panel: #141414;
      --panel-hover: #1d1d1d;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --accent: #ff3038;
      --border: #292929;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,48,56,.13), transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { width: 100%; max-width: 440px; }
    .card {
      position: relative;
      overflow: hidden;
      padding: 34px 22px 24px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: rgba(17,17,17,.94);
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
      text-align: center;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    .emblem {
      width: 78px; height: 78px;
      display: grid; place-items: center;
      margin: 0 auto 18px;
      border: 1px solid rgba(255,48,56,.65);
      border-radius: 50%;
      color: var(--accent);
      background: #1b0d0e;
      font-size: 38px;
      font-weight: 900;
      text-shadow: 0 0 22px rgba(255,48,56,.3);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 9vw, 2.8rem);
      line-height: 1;
      letter-spacing: .16em;
      font-weight: 900;
    }
    .tagline {
      margin: 13px 0 27px;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .16em;
      line-height: 1.8;
    }
    .links { display: grid; gap: 12px; }
    .link {
      min-height: 58px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 17px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      text-align: left;
      font-size: .94rem;
      font-weight: 750;
      letter-spacing: .035em;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
      cursor: pointer;
      font-family: inherit;
    }
    .link:hover, .link:focus-visible {
      transform: translateY(-2px);
      background: var(--panel-hover);
      border-color: #555;
      outline: none;
    }
    .link:focus-visible { box-shadow: 0 0 0 3px rgba(255,48,56,.25); }
    .icon {
      display: grid; place-items: center;
      flex: 0 0 34px;
      width: 34px; height: 34px;
      border-radius: 10px;
      background: #242424;
      font-size: 1.12rem;
    }
    .arrow { margin-left: auto; color: #777; font-size: 1.2rem; }
    .support {
      border-color: rgba(255,48,56,.55);
      background: linear-gradient(110deg, #351012, #1b1112);
    }
    .support .icon { background: rgba(255,48,56,.15); color: #ff6268; }
    .support:hover { border-color: var(--accent); background: linear-gradient(110deg, #461417, #241214); }
    .note {
      margin: 11px 2px 0;
      color: #999;
      font-size: .76rem;
      line-height: 1.5;
      text-align: left;
    }
    .footer {
      margin-top: 23px;
      color: #777;
      font-size: .78rem;
      line-height: 1.8;
    }
    .footer strong { color: #c9c9c9; letter-spacing: .12em; }
    @media (max-width: 360px) {
      .card { padding: 30px 16px 20px; }
      .link { padding: 0 12px; font-size: .88rem; }
      .tagline { letter-spacing: .1em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="PHOENIX links">
      <div class="emblem" aria-hidden="true">✦</div>
      <h1>PHOENIX</h1>
      <p class="tagline">FITNESS · DISCIPLINE · PROGRESS</p>

      <nav class="links" aria-label="Мої посилання">
        <a class="link" href="https://www.instagram.com/rodion_mzmz?psln=Z3cyMTg5a2tidGVi&utm_source=qr" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">◎</span>
          <span>INSTAGRAM</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="link" href="https://www.tiktok.com/@rodion.x13" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">♪</span>
          <span>TIKTOK</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="link" href="https://t.me/VIPU6BOSS" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">➤</span>
          <span>TELEGRAM</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <button class="link support" id="supportButton" type="button" aria-describedby="supportNote">
          <span class="icon" aria-hidden="true">♥</span>
          <span>ПІДТРИМАТИ НА MONOBANK</span><span class="arrow" aria-hidden="true">↗</span>
        </button>
      </nav>
      <p class="note" id="supportNote">Посилання на Monobank ще не додано. Кнопка стане активним переходом, коли додаси посилання на банку.</p>
      <div class="footer">
        <strong>PHOENIX</strong><br>
        Дякую, що ти зі мною 🖤
      </div>
    </section>
  </main>
  <script>
    document.getElementById("supportButton").addEventListener("click", function () {
      alert("Посилання на Monobank ще не додано. Відредагуй index.html і встав своє посилання на банку.");
    });
  </script>
</body>
</html>
